*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-size:16px; line-height:1.45; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; padding-bottom:calc(72px + env(safe-area-inset-bottom)); }

label.lbl { display:block; font-weight:600; font-size:14px; margin:var(--sp-3) 0 var(--sp-1); }

.brandline { color:var(--brand); font-weight:700; font-size:13px; letter-spacing:.4px; text-transform:uppercase; margin:0 0 4px; }
.err { color:var(--bad); font-weight:600; min-height:1.4em; margin:8px 0 0; }

table { width:100%; border-collapse:collapse; font-size:13.5px; }

.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

ul.plain { padding-left:18px; margin:6px 0; } ul.plain li { margin-bottom:6px; }
.flagbar { border-radius:var(--r); padding:10px 12px; background:var(--bad-tint); border:1px solid var(--bad-line); color:var(--bad); font-weight:600; margin-bottom:var(--sp-4); }

/* ---------------- helpers ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }
function myCode(){ return localStorage.getItem("ci_code") || ""; }
function post(body){
  var spec = ACTIONS[body.action], args = { p_code: myCode() };
  spec[1].forEach(function(k){ args["p_"+k] = body[k] === undefined ? null : body[k]; });
  return fetch(SB + "/rest/v1/rpc/" + spec[0], { method:"POST", headers:{ "Content-Type":"application/json", "apikey":ANON, "Authorization":"Bearer "+ANON }, body: JSON.stringify(args) })
    .then(function(r){ return r.text().then(function(t){
      var j = {}; try { j = JSON.parse(t); } catch(e) {}
      if (!r.ok) { var m = String(j.message || j.hint || t || ""); return { ok:false, error: m.indexOf("forbidden")>=0 ? "forbidden" : (m.indexOf("out of range")>=0 || m.indexOf("violates")>=0) ? "bad_value" : "server_error" }; }
      return j;
    }); })
    .catch(function(){ return { ok:false, error:"offline" }; });
}
function toast(m){ var e=$("toast"); e.textContent=m; e.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(function(){ e.classList.remove("on"); },1800); }
function isoDate(d){ return d.toISOString().slice(0,10); }
function parseD(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s, n){ var d=parseD(s); d.setDate(d.getDate()+n); return isoDate(new Date(d.getTime()-d.getTimezoneOffset()*60000)); }
function fmtDate(s, long){ var d=parseD(s); var out=d.toLocaleDateString(LANG==="fr"?"fr-CA":"en-CA", long?{weekday:"long", day:"numeric", month:"long"}:{weekday:"short", day:"numeric", month:"short"}); return out.charAt(0).toUpperCase()+out.slice(1); }
function byDate(arr){ var m={}; (arr||[]).forEach(function(x){ m[x.date]=x; }); return m; }
function todayCheckin(){ return byDate(S.checkins)[S.today.date] || null; }
function eventOn(d){ return byDate(S.events)[d] || null; }
function dayTypeOn(d){ var e=eventOn(d); return e?e.etype:"Off"; }
function dayLabel(d){ var e=eventOn(d), typ=e?e.etype:"Off", s=t("day."+typ); if(e&&e.time_label&&typ!=="Exams") s+=" · "+e.time_label; if(e&&e.detail&&(typ==="Game"||typ==="Travel")) s+=" — "+e.detail; return s; }
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent); }
function smsHref(c){ var ph=S.lens_phone||""; var body=encodeURIComponent(fmt(t("sms_body"),{c:t("colour."+c.colour), l:c.l, r:c.r})); return "sms:"+ph+(isIOS()?"&":"?")+"body="+body; }

/* ---------------- boot / auth ---------------- */
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i")); });
  document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-l")===LANG ? "true":"false"); });
  if (S) renderAll();
}
document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ LANG=b.getAttribute("data-l"); localStorage.setItem("ci_lang", LANG); applyLang(); }); });

function showLock(msg){ $("app").classList.add("hidden"); $("lock").classList.remove("hidden"); $("lockerr").textContent = msg||""; $("pass").value=""; }
function boot(){
  if (!myCode()) { showLock(""); return; }
  post({action:"state"}).then(function(r){
    if (!r.ok) { if (r.error==="bad_code"||r.error==="locked_out") localStorage.removeItem("ci_code"); showLock(r.error==="offline"?t("offline"):(r.error==="locked_out"?t("locked_out"):(r.error==="bad_code"?t("bad_code"):""))); return; }
    setState(r); $("lock").classList.add("hidden"); $("app").classList.remove("hidden"); renderAll();
  });
}
function setState(r){ S = r; ME = r.me; if (S.content) { ["fr","en"].forEach(function(l){ if (S.content[l]) Object.keys(S.content[l]).forEach(function(k){ T[l][k] = S.content[l][k]; }); }); } }
$("enter").addEventListener("click", function(){ var v=$("pass").value.trim(); if(!v) return; localStorage.setItem("ci_code", v); $("lockerr").textContent=""; boot(); });
$("pass").addEventListener("keydown", function(e){ if(e.key==="Enter") $("enter").click(); });
$("signout").addEventListener("click", function(){ localStorage.removeItem("ci_code"); S=null; ME=null; showLock(""); });
function refresh(){ if(!S||document.hidden) return; post({action:"state"}).then(function(r){ if(r.ok){ setState(r); renderAll(); } }); }
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh(); });

/* ---- Trend ---- */
function renderTrend(){
  var m=byDate(S.checkins), d=S.today.date, days=[], i;
  for (i=27;i>=0;i--) days.push(addDays(d,-i));
  var dow = LANG==="fr" ? ["D","L","M","M","J","V","S"] : ["S","M","T","W","T","F","S"];
  var first=parseD(days[0]).getDay(), h='<div class="card"><h2>'+esc(t("trend_title"))+'</h2><div class="strip">';
  for (i=0;i<7;i++) h+='<div class="cell dow">'+dow[(first+i)%7]+'</div>';
  days.forEach(function(x){ var c=m[x]; h+='<div class="cell '+(c?c.colour:"")+(x===d?" today":"")+'" title="'+x+'">'+parseD(x).getDate()+'</div>'; });
  h += '</div>';
  var last7=days.slice(21), cnt={GREEN:0,YELLOW:0,RED:0}; last7.forEach(function(x){ if(m[x]) cnt[m[x].colour]++; });
  h += '<div class="counts"><span class="small muted" style="align-self:center">'+esc(t("counts7"))+'</span>'
     + ['GREEN','YELLOW','RED'].map(function(k){ return '<span class="chip"><i class="dot '+k+'"></i>'+esc(t("colour."+k))+' '+cnt[k]+'</span>'; }).join("")+'</div></div>';
  // chart
  var pts = days.map(function(x,idx){ var c=m[x]; return c?{x:idx,y:c.worst,c:c.colour}:null; }).filter(Boolean);
  h += '<div class="card"><h2>'+esc(t("chart_title"))+'</h2>';
  if (!pts.length) h += '<p class="muted">'+esc(t("no_data"))+'</p>';
  else {
    var W=320,H=150,px=28,py=10, sx=function(x){ return px+(x/27)*(W-px-8); }, sy=function(y){ return py+(10-y)/10*(H-py-18); };
    var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'">';
    [0,3,5,10].forEach(function(g){ svg+='<line x1="'+px+'" y1="'+sy(g)+'" x2="'+(W-8)+'" y2="'+sy(g)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(px-6)+'" y="'+(sy(g)+4)+'" font-size="10" text-anchor="end" fill="var(--ink-3)">'+g+'</text>'; });
    if (S.baseline && S.baseline.b!=null) svg+='<line x1="'+px+'" y1="'+sy(S.baseline.b)+'" x2="'+(W-8)+'" y2="'+sy(S.baseline.b)+'" stroke="var(--ink-2)" stroke-dasharray="4 3" stroke-width="1.2"/><text x="'+(px+4)+'" y="'+(sy(S.baseline.b)-4)+'" font-size="9" text-anchor="start" fill="var(--ink-2)">'+esc(t("baseline_line"))+' '+S.baseline.b+'</text>';
    svg+='<polyline fill="none" stroke="var(--ink-2)" stroke-width="1.5" points="'+pts.map(function(p){ return sx(p.x)+","+sy(p.y); }).join(" ")+'"/>';
    pts.forEach(function(p){ svg+='<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="4" fill="var(--'+(p.c==="GREEN"?"ok":p.c==="YELLOW"?"warn":"bad")+'-fill)"/>'; });
    svg+='</svg>'; h+=svg;
  }
  h += '</div>';
  $("t-trend").innerHTML = h;
}

/* ---- Gym ---- */
function renderGym(){
  var c=todayCheckin(), d=S.today.date, col=c?c.colour:null, gm=byDate(S.gym), todayG=gm[d], h='';
  var lastSess=null, dates=Object.keys(gm).filter(function(x){ return x<d; }).sort(); if(dates.length) lastSess=gm[dates[dates.length-1]].session;
  var suggested = col==="RED" ? "ISO" : (lastSess==="A"?"B":"A");
  if (!gymUI.session || (col==="RED" && gymUI.session!=="ISO")) gymUI.session = todayG ? todayG.session : suggested;
  if (todayG && !gymUI.loaded) { gymUI.ex = {}; (todayG.exercises||[]).forEach(function(e){ gymUI.ex[e.id]={done:e.done, load:e.load}; }); gymUI.loaded=true; }
  h += '<div class="datehead"><div class="d">'+esc(t("gym_title"))+'</div>'+(col?'<span class="daypill"><i class="dot '+col+'"></i>'+esc(t("colour."+col))+'</span>':'')+'</div>';
  if (!c) h += '<p class="note" style="margin-bottom:12px">'+esc(t("gym_nocheck"))+'</p>';
  if (col==="RED") h += '<p class="note" style="margin-bottom:12px">'+esc(t("gym_red"))+'</p>';
  else h += '<div class="seg" style="margin-bottom:12px"><button data-s="A" aria-pressed="'+(gymUI.session==="A")+'">A</button><button data-s="B" aria-pressed="'+(gymUI.session==="B")+'">B</button></div>'
          + '<p class="small muted" style="margin:0 0 10px">'+esc(fmt(t("gym_suggest"),{s:suggested}))+' · '+esc(col==="YELLOW"?t("gym_rule_yellow"):t("gym_rule_green"))+'</p>';
  var list=t("ex."+gymUI.session);
  h += '<div class="card"><h2>'+esc(t("sess."+gymUI.session))+(col==="YELLOW"&&gymUI.session!=="ISO"?'<span class="badge">'+esc(t("gym_80"))+'</span>':'')+'</h2>';
  list.forEach(function(ex){
    if (ex[4]==="sled" && col==="YELLOW") return;
    var st=gymUI.ex[ex[0]]||{};
    h += '<div class="exrow"><button class="chk" data-id="'+ex[0]+'" role="checkbox" aria-checked="'+(!!st.done)+'"></button>'
       + '<div><div class="nm">'+esc(ex[1])+'</div><div class="meta">'+esc(ex[2])+'</div>'+(ex[3]?'<div class="how">'+esc(ex[3])+'</div>':'')+'</div>'
       + '<input type="text" inputmode="decimal" data-id="'+ex[0]+'" placeholder="'+esc(t("load"))+'" value="'+esc(st.load||"")+'"></div>';
  });
  h += '<button class="btn primary" id="savegym" style="margin-top:12px">'+esc(t("save_gym"))+'</button></div>';
  $("t-gym").innerHTML = h;
  $("t-gym").querySelectorAll(".seg button").forEach(function(b){ b.addEventListener("click", function(){ gymUI.session=b.getAttribute("data-s"); renderGym(); }); });
  $("t-gym").querySelectorAll(".chk").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-id"); gymUI.ex[id]=gymUI.ex[id]||{}; gymUI.ex[id].done=!gymUI.ex[id].done; renderGym(); }); });
  $("t-gym").querySelectorAll("input[data-id]").forEach(function(i){ i.addEventListener("input", function(){ var id=i.getAttribute("data-id"); gymUI.ex[id]=gymUI.ex[id]||{}; gymUI.ex[id].load=i.value; }); });
  $("savegym").addEventListener("click", function(){
    var exs=list.map(function(ex){ var st=gymUI.ex[ex[0]]||{}; return {id:ex[0], done:!!st.done, load:st.load||""}; });
    post({action:"gym", date:d, session:gymUI.session, exercises:exs, note:null}).then(function(r){ if(!r.ok){ toast(r.error); return; } setState(r); toast(t("gym_saved")); renderAll(); });
  });
}

     + '<button class="btn sm primary" id="evsave" style="margin-top:8px">'+esc(t("adm_save"))+'</button>'
     + '<p class="small muted" style="margin:12px 0 4px">'+esc(t("adm_upcoming"))+'</p><table>'+ups.map(function(e){ return '<tr><td>'+esc(e.date.slice(5))+'</td><td>'+esc(t("day."+e.etype))+'</td><td class="muted">'+esc((e.time_label||"")+(e.detail?" · "+e.detail:""))+'</td><td><button class="linkbtn small" data-evdel="'+e.date+'">×</button></td></tr>'; }).join("")+'</table></div>';
  h += '<div class="card"><h2>'+esc(t("adm_settings"))+'</h2><label class="lbl" for="phone">'+esc(t("adm_phone"))+'</label><div class="row2"><input type="tel" id="phone" value="'+esc(S.lens_phone||"")+'" placeholder="+1514…"><button class="btn sm primary" id="phonesave">'+esc(t("adm_save"))+'</button></div></div>';
  $("t-admin").innerHTML = h;
  function act(body, okmsg){ return post(body).then(function(r){ if(!r.ok){ toast(r.error); return; } setState(r); toast(okmsg||t("saved")); renderAll(); }); }
  $("bset").addEventListener("click", function(){ var v=$("bval").value; if(v==="") return; act({action:"set_baseline", b:+v}); });
  $("bclear").addEventListener("click", function(){ act({action:"set_baseline", b:null}); });
  $("noteadd").addEventListener("click", function(){ var v=$("notetxt").value.trim(); if(!v) return; act({action:"note", text:v}); });
  $("t-admin").querySelectorAll("[data-del]").forEach(function(b){ b.addEventListener("click", function(){ if(confirm(t("confirm_del"))) act({action:"delete_checkin", date:b.getAttribute("data-del")}); }); });
  $("t-admin").querySelectorAll("[data-evdel]").forEach(function(b){ b.addEventListener("click", function(){ if(confirm(t("confirm_del"))) act({action:"delete_event", date:b.getAttribute("data-evdel")}); }); });
  $("evsave").addEventListener("click", function(){ var d=$("evdate").value; if(!d) return; act({action:"event", date:d, etype:$("evtype").value, time:$("evtime").value, detail:$("evdetail").value}); });
  $("phonesave").addEventListener("click", function(){ act({action:"setting", key:"lens_phone", value:$("phone").value.trim()}); });
  $("csv").addEventListener("click", function(){
    var rows=[["date","day_type","left","right","worst","settled","daily_life_pain","colour","note"]];
    (S.checkins||[]).forEach(function(c){ rows.push([c.date,c.day_type||"",c.l,c.r,c.worst,c.settled,c.dlp,c.colour,(c.note||"").replace(/"/g,'""')]); });
    rows.push([]); rows.push(["gym_date","session","colour_at","exercises_json"]);
    (S.gym||[]).forEach(function(g){ rows.push([g.date,g.session,g.colour_at||"",JSON.stringify(g.exercises).replace(/"/g,'""')]); });
    var csv=rows.map(function(r){ return r.map(function(v){ return '"'+String(v==null?"":v)+'"'; }).join(","); }).join("\n");
    var a=document.createElement("a"); a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv); a.download="checkin-"+S.today.date+".csv"; document.body.appendChild(a); a.click(); a.remove();
  });
}

/* ---------------- start ---------------- */
applyLang(); boot();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
</body>
</html>
