<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Check-in</title>
<style>
:root {
  --brand:#ED1B2F; --brand-ink:#B9101F; --brand-tint:#FDECEE;
  --ok:#3F6B1B;   --ok-fill:#7E9A3E;   --ok-fill-2:#6B8A2F;   --ok-tint:#EEF4E4;
  --warn:#8A4B0F; --warn-fill:#F28B1E; --warn-fill-2:#E07A0F; --warn-tint:#FDF1E4;
  --bad:#B10E22;  --bad-fill:#E3172C;  --bad-fill-2:#C7102A;  --bad-tint:#FDEBED;
  --bg:#F7F8FA; --surface:#FFFFFF; --raised:#F1F3F6; --ink:#1E293B; --ink-2:#475569; --ink-3:#6B7A90;
  --line:#E6E9EE; --line-2:#CBD2DC; --focus:#2563EB;
  --r-sm:10px; --r:14px; --r-lg:20px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --shadow-1:0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.06);
  --shadow-2:0 6px 18px rgba(15,23,42,.10), 0 1px 3px rgba(15,23,42,.06);
  --shadow-3:0 14px 34px rgba(15,23,42,.16);
  --tap:44px; --dur:200ms; --dur-out:140ms; --ease:cubic-bezier(.2,.7,.2,1);
  --font-head:"Outfit","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:"Work Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand:#FF5266; --brand-ink:#FF7A8A; --brand-tint:#3A1B21;
    --ok:#B9D68C;   --ok-fill:#5F7F2E;   --ok-fill-2:#4E6B25;   --ok-tint:#22301A;
    --warn:#F2B77C; --warn-fill:#C46F14; --warn-fill-2:#A85E10; --warn-tint:#33261A;
    --bad:#FF8A99;  --bad-fill:#C51B2E;  --bad-fill-2:#A81525;  --bad-tint:#3A191E;
    --bg:#0F1115; --surface:#181B21; --raised:#20242C; --ink:#EEF1F5; --ink-2:#B9C2CF; --ink-3:#8C97A8;
    --line:#2A2F39; --line-2:#3B424F; --focus:#93B4FF;
    --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 8px 22px rgba(0,0,0,.55); --shadow-3:0 16px 40px rgba(0,0,0,.6);
  }
}
*, *::before, *::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; font-family:var(--font-body); font-size:16px; line-height:1.5; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; touch-action:manipulation; padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
h1,h2,h3 { margin:0; line-height:1.2; font-family:var(--font-head); font-weight:700; letter-spacing:-.01em; }
button, input, select, textarea { font:inherit; color:inherit; }
button { -webkit-tap-highlight-color:transparent; cursor:pointer; touch-action:manipulation; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; border-radius:6px; }
.hidden { display:none !important; }
.muted { color:var(--ink-3); }
.small { font-size:14px; }
.num { font-variant-numeric:tabular-nums; }
.wrap { max-width:560px; margin:0 auto; padding:var(--sp-4) var(--sp-4) var(--sp-5); }
.card { background:var(--surface); border-radius:var(--r-lg); padding:var(--sp-4); box-shadow:var(--shadow-1); margin-bottom:var(--sp-4); }
.card h2 { font-size:18px; margin-bottom:var(--sp-2); }
.eyebrow { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin:0 0 4px; }
/* buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 18px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--surface); font-weight:600; width:100%; box-shadow:var(--shadow-1); transition:transform var(--dur-out) var(--ease), box-shadow var(--dur) var(--ease), opacity var(--dur); }
.btn:active { transform:scale(.98); box-shadow:none; }
.btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 6px 16px rgba(237,27,47,.28); }
.btn.primary:active { background:var(--brand-ink); }
.btn.ghost { background:transparent; box-shadow:none; }
a.btn { color:var(--ink); text-decoration:none; }
.btn.sm { width:auto; min-height:40px; padding:6px 14px; font-size:14px; }
.btn:disabled { opacity:.4; box-shadow:none; transform:none; cursor:default; }
.btn.loading { position:relative; color:transparent; }
.btn.loading::after { content:""; position:absolute; width:20px; height:20px; border-radius:50%; border:2.5px solid rgba(255,255,255,.45); border-top-color:#fff; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.linkbtn { background:none; border:0; padding:4px 2px; min-height:32px; color:var(--brand-ink); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
input[type=text], input[type=number], input[type=password], input[type=date], input[type=tel], select, textarea { width:100%; min-height:48px; padding:10px 14px; border:1.5px solid var(--line-2); border-radius:var(--r); background:var(--surface); transition:border-color var(--dur), box-shadow var(--dur); }
input:focus, select:focus, textarea:focus { outline:none; border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
textarea { min-height:88px; }
label.lbl { display:block; font-weight:600; font-size:14px; margin:var(--sp-3) 0 var(--sp-1); }
/* lock */
#lock { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:var(--sp-4); background:radial-gradient(120% 80% at 50% 0%, var(--brand-tint) 0%, var(--bg) 55%); }
#lock .card { width:100%; max-width:380px; padding:var(--sp-5); box-shadow:var(--shadow-2); text-align:center; }
#lock .mark { width:64px; height:64px; border-radius:18px; background:var(--brand); margin:0 auto var(--sp-3); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(237,27,47,.3); }
#lock .mark svg { width:36px; height:36px; }
#lock h1 { font-size:26px; }
#lock label.lbl { text-align:left; }
#lock input { text-align:center; font-size:28px; letter-spacing:.35em; font-family:var(--font-head); font-weight:700; min-height:60px; }
#lock .lang { justify-content:center; width:max-content; margin:var(--sp-4) auto 0; }
.brandline { color:var(--brand); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 4px; }
.err { color:var(--bad); font-weight:600; min-height:1.4em; margin:10px 0 0; font-size:14px; }
/* topbar */
.topbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top); }
.topbar-in { max-width:560px; margin:0 auto; padding:12px var(--sp-4); display:flex; align-items:center; justify-content:space-between; gap:8px; }
.topbar h1 { font-size:20px; }
.topbar .who { font-size:13px; color:var(--ink-3); }
.lang { display:flex; background:var(--raised); border-radius:var(--r-pill); padding:3px; gap:2px; }
.lang button { border:0; background:transparent; padding:6px 12px; border-radius:var(--r-pill); font-size:13px; font-weight:600; color:var(--ink-3); min-height:32px; transition:background var(--dur), color var(--dur); }
.lang button[aria-pressed=true] { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1); }
/* bottom tabs */
.tabbar { position:fixed; left:0; right:0; bottom:0; background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:saturate(1.4) blur(16px); -webkit-backdrop-filter:saturate(1.4) blur(16px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:5; }
.tabbar-in { max-width:560px; margin:0 auto; display:flex; padding:6px 8px 4px; gap:4px; }
.tab { flex:1; border:0; background:transparent; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11.5px; font-weight:600; color:var(--ink-3); border-radius:var(--r); transition:color var(--dur), background var(--dur), transform var(--dur-out); }
.tab:active { transform:scale(.96); }
.tab svg { width:24px; height:24px; padding:3px 12px; border-radius:var(--r-pill); box-sizing:content-box; transition:background var(--dur); }
.tab[aria-selected=true] { color:var(--brand-ink); }
.tab[aria-selected=true] svg { background:var(--brand-tint); }
/* today */
.datehead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:2px 0 var(--sp-4); flex-wrap:wrap; }
.datehead .d { font-family:var(--font-head); font-weight:700; font-size:22px; letter-spacing:-.01em; }
.daypill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--r-pill); background:var(--surface); box-shadow:var(--shadow-1); font-weight:600; font-size:13.5px; }
.legrow { margin-top:var(--sp-4); }
.legrow .t { font-weight:600; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.legrow .t span:last-child { color:var(--ink-3); font-weight:500; font-size:12.5px; }
.picker { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
.picker button { min-height:46px; border-radius:var(--r-sm); border:1.5px solid var(--line); background:var(--surface); font-family:var(--font-head); font-weight:700; font-size:17px; padding:0; color:var(--ink-2); font-variant-numeric:tabular-nums; transition:transform var(--dur-out) var(--ease), background var(--dur), border-color var(--dur), color var(--dur); }
.picker button:active { transform:scale(.94); }
.picker button[aria-pressed=true] { color:#fff; border-color:transparent; box-shadow:var(--shadow-1); }
.picker button.n0[aria-pressed=true], .picker button.n1[aria-pressed=true], .picker button.n2[aria-pressed=true], .picker button.n3[aria-pressed=true] { background:var(--ok-fill); }
.picker button.n4[aria-pressed=true], .picker button.n5[aria-pressed=true] { background:var(--warn-fill); }
.picker button.n6[aria-pressed=true], .picker button.n7[aria-pressed=true], .picker button.n8[aria-pressed=true], .picker button.n9[aria-pressed=true], .picker button.n10[aria-pressed=true] { background:var(--bad-fill); }
.switch { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-top:1px solid var(--line); min-height:var(--tap); }
.switch:first-of-type { border-top:0; }
.switch .q { flex:1; font-size:15px; }
.sw { position:relative; width:54px; height:32px; border-radius:var(--r-pill); background:var(--line-2); border:0; flex:0 0 auto; transition:background var(--dur) var(--ease); }
.sw::after { content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform var(--dur) var(--ease); }
.sw[aria-checked=true] { background:var(--ok-fill); }
.sw[aria-checked=true]::after { transform:translateX(22px); }
.sw.neg[aria-checked=true] { background:var(--bad-fill); }
.result { border-radius:var(--r-lg); padding:var(--sp-5) var(--sp-4) var(--sp-4); color:#fff; margin-bottom:var(--sp-4); box-shadow:var(--shadow-3); animation:pop var(--dur) var(--ease); }
@keyframes pop { from { transform:translateY(6px) scale(.985); opacity:0; } to { transform:none; opacity:1; } }
.result.GREEN { background:linear-gradient(160deg, var(--ok-fill) 0%, var(--ok-fill-2) 100%); }
.result.YELLOW { background:linear-gradient(160deg, var(--warn-fill) 0%, var(--warn-fill-2) 100%); }
.result.RED { background:linear-gradient(160deg, var(--bad-fill) 0%, var(--bad-fill-2) 100%); }
.result .head { display:flex; align-items:center; gap:14px; }
.result .icon { width:52px; height:52px; border-radius:16px; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.result .icon svg { width:30px; height:30px; }
.result .word { font-family:var(--font-head); font-size:36px; font-weight:800; letter-spacing:.01em; line-height:1; }
.result .sc { font-size:14px; opacity:.92; margin-top:4px; font-variant-numeric:tabular-nums; }
.result ul { margin:16px 0 0; padding:0; list-style:none; }
.result li { padding:10px 0; border-top:1px solid rgba(255,255,255,.28); font-size:15.5px; display:flex; gap:12px; line-height:1.4; }
.result li b { flex:0 0 76px; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; opacity:.9; padding-top:3px; font-weight:700; }
.result .btn { background:#fff; color:var(--ink); border-color:#fff; margin-top:14px; box-shadow:none; }
.coachbox { border:1.5px solid var(--warn-fill); background:var(--warn-tint); border-radius:var(--r); padding:12px 14px; font-size:15px; color:var(--ink); }
.coachbox .lbl2 { font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--warn); font-weight:700; display:block; margin-bottom:4px; }
.note { background:var(--surface); border-left:4px solid var(--line-2); padding:10px 14px; border-radius:var(--r-sm); font-size:14px; color:var(--ink-2); box-shadow:var(--shadow-1); }
/* trend */
.strip { display:grid; grid-template-columns:repeat(7, 1fr); gap:7px; }
.strip .cell { aspect-ratio:1; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:600; background:var(--raised); color:var(--ink-3); font-variant-numeric:tabular-nums; }
.strip .cell.GREEN { background:var(--ok-fill); color:#fff; }
.strip .cell.YELLOW { background:var(--warn-fill); color:#fff; }
.strip .cell.RED { background:var(--bad-fill); color:#fff; }
.strip .cell.today { box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.strip .dow { aspect-ratio:auto; background:transparent; font-size:11px; letter-spacing:.04em; }
.counts { display:flex; gap:8px; margin-top:var(--sp-4); flex-wrap:wrap; align-items:center; }
.chip { display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border-radius:var(--r-pill); font-size:13px; font-weight:600; background:var(--raised); font-variant-numeric:tabular-nums; }
.chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
svg.chart { width:100%; height:auto; display:block; }
/* gym */
.seg { display:flex; background:var(--raised); border-radius:var(--r); padding:4px; gap:4px; }
.seg button { flex:1; border:0; background:transparent; min-height:42px; font-weight:700; border-radius:var(--r-sm); font-family:var(--font-head); font-size:16px; color:var(--ink-3); transition:background var(--dur), color var(--dur); }
.seg button[aria-pressed=true] { background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1); }
.seg3 button { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:52px; line-height:1.1; gap:2px; }
.seg3 button small { font-family:var(--font-body); font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--brand-ink); }
.whycard { background:var(--raised); box-shadow:none; }
.exrow { display:grid; grid-template-columns:30px 1fr 84px; gap:12px; align-items:start; padding:14px 0; border-top:1px solid var(--line); }
.exrow:first-of-type { border-top:0; }
.exrow .chk { width:28px; height:28px; border-radius:9px; border:2px solid var(--line-2); background:var(--surface); margin-top:2px; padding:0; position:relative; transition:background var(--dur), border-color var(--dur), transform var(--dur-out); }
.exrow .chk:active { transform:scale(.9); }
.exrow .chk[aria-checked=true] { background:var(--ok-fill); border-color:var(--ok-fill); }
.exrow .chk[aria-checked=true]::after { content:""; position:absolute; left:8px; top:3px; width:7px; height:13px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg); }
.exrow .nm { font-weight:600; line-height:1.3; }
.exrow .meta { font-size:13.5px; color:var(--ink-2); margin-top:2px; font-variant-numeric:tabular-nums; }
.exrow .how { font-size:13px; color:var(--ink-3); margin-top:2px; }
.exrow .load { position:relative; }
.exrow .load input { min-height:44px; padding:6px 30px 6px 8px; text-align:right; font-variant-numeric:tabular-nums; }
.exrow .load span { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:12.5px; color:var(--ink-3); font-weight:600; pointer-events:none; }
.badge { display:inline-block; padding:2px 9px; border-radius:var(--r-pill); font-size:12px; font-weight:700; background:var(--warn-tint); color:var(--warn); margin-left:8px; vertical-align:middle; font-family:var(--font-body); }
/* tables */
table { width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); padding:6px 4px; border-bottom:1px solid var(--line-2); font-weight:600; }
td { padding:9px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
.dot { display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:middle; }
.dot.GREEN { background:var(--ok-fill); } .dot.YELLOW { background:var(--warn-fill); } .dot.RED { background:var(--bad-fill); }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
#toast { position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(6px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:var(--r-pill); font-weight:600; opacity:0; transition:opacity var(--dur), transform var(--dur) var(--ease); pointer-events:none; z-index:9; max-width:90vw; text-align:center; box-shadow:var(--shadow-2); }
#toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
ul.plain { padding-left:20px; margin:6px 0; } ul.plain li { margin-bottom:8px; }
.flagbar { border-radius:var(--r); padding:12px 14px; background:var(--bad-tint); border-left:4px solid var(--bad-fill); color:var(--bad); font-weight:600; margin-bottom:var(--sp-4); font-size:14.5px; }
/* season features */
.nudge { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--warn-tint); border-left:4px solid var(--warn-fill); border-radius:var(--r); padding:10px 14px; margin-bottom:var(--sp-4); font-size:14.5px; color:var(--ink); }
.nudge .btn { width:auto; min-height:40px; padding:6px 14px; font-size:14px; }
.streak { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-3); }
.savedline { display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:600; }
.mini { min-height:44px; padding:8px 12px; }
.qrow { margin-top:12px; } .qrow .t { font-weight:600; font-size:14.5px; margin-bottom:6px; line-height:1.3; }
#sheet { position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); overflow:auto; }
#sheet .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
#sheet .top h2 { font-size:20px; }
#sheet .count { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:var(--r-lg); color:#fff; text-align:center; padding:24px; min-height:52vh; transition:background var(--dur); }
#sheet .count.hold { background:linear-gradient(160deg, var(--bad-fill), var(--bad-fill-2)); }
#sheet .count.rest { background:linear-gradient(160deg, #2F6F9F, #245A82); }
#sheet .count .ph { font-family:var(--font-head); font-size:22px; font-weight:800; letter-spacing:.12em; opacity:.9; }
#sheet .count .n { font-family:var(--font-head); font-size:120px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; margin:8px 0; }
#sheet .count .rd { font-size:15px; opacity:.9; }
#sheet .actions { display:flex; gap:10px; margin-top:14px; }
#sheet .actions .btn { flex:1; }
.delta { font-family:var(--font-head); font-size:40px; font-weight:800; text-align:center; margin:8px 0; }
.exrow .hint { grid-column:2 / -1; font-size:12.5px; font-weight:600; color:var(--ok); margin-top:-6px; }
.exrow .hint.hold { color:var(--ink-3); } .exrow .hint.y { color:var(--warn); }
.progrow { display:grid; grid-template-columns:1fr 120px; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }

function progressionHint(id, col){

  if (col==="YELLOW") return {cls:"y", txt:fmt(t("prog_yellow"),{v:r25(last.load*0.8)}), v:r25(last.load*0.8)};
  var ok = hist.length>=2 && hist.slice(-2).every(function(x){ var c=m[x.date]; return x.done && c && c.colour==="GREEN" && (c.session_pain==null || c.session_pain<=3); });
  if (ok) { var d=Math.max(2.5, r25(last.load*0.05)); return {cls:"", txt:fmt(t("prog_up"),{d:d, last:last.load}), v:last.load+d}; }
  return {cls:"hold", txt:fmt(t("prog_hold"),{last:last.load}), v:last.load};
}
function exName(id){ var n=null; ["A","B","ISO"].forEach(function(k){ (t("ex."+k)||[]).forEach(function(e){ if(e[0]===id) n=e[1]; }); }); return n||id; }
function progressionCard(){
  var keys=["A2","A3","A5","B3"], rows=""; keys.forEach(function(id){
    var hist=loadHistory(id); if(!hist.length) return;
    var last3=hist.slice(-3).map(function(x){ return x.load; }), W=120,H=32, xs=hist.slice(-8), mn=Math.min.apply(null,xs.map(function(x){return x.load;})), mx=Math.max.apply(null,xs.map(function(x){return x.load;}));
    var pts=xs.map(function(x,i){ var px=xs.length>1? i/(xs.length-1)*(W-8)+4 : W/2, py= mx===mn? H/2 : H-4-((x.load-mn)/(mx-mn))*(H-8); return px+","+py; }).join(" ");
    var svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" aria-hidden="true"><polyline fill="none" stroke="var(--ok-fill)" stroke-width="2" points="'+pts+'"/></svg>';
    var trend=""; if(hist.length>=2){ var d=hist[hist.length-1].load-hist[0].load, w=Math.max(1,Math.round((parseD(hist[hist.length-1].date)-parseD(hist[0].date))/6048e5)); trend=' · '+esc(fmt(t("prog_trend"),{d:(d>=0?"+":"")+d, w:w})); }
    rows += '<div class="progrow"><div><div class="nm">'+esc(exName(id))+'</div><div class="lds">'+last3.join(" → ")+' lb'+trend+'</div></div>'+svg+'</div>';
  });
  return rows ? '<div class="card"><h2>'+esc(t("prog_title"))+'</h2>'+rows+'</div>' : "";
}
function renderGym(){
  var c=todayCheckin(), d=S.today.date, col=c?c.colour:null, gm=byDate(S.gym), todayG=gm[d], h='';
  var lastSess=null, lastDate=null, dates=Object.keys(gm).filter(function(x){ return x<d; }).sort();
  if(dates.length){ lastDate=dates[dates.length-1]; lastSess=gm[lastDate].session; }
  var gameSoon = dayTypeOn(d)==="Game" || dayTypeOn(addDays(d,1))==="Game";
  var suggested = (col==="RED" || gameSoon) ? "ISO" : (lastSess==="A" ? "B" : "A");
  if (!gymUI.session) gymUI.session = todayG ? todayG.session : suggested;
  if (col==="RED") gymUI.session = "ISO";
  if (todayG && !gymUI.loaded) { gymUI.ex = {}; (todayG.exercises||[]).forEach(function(e){ gymUI.ex[e.id]={done:e.done, load:e.load}; }); gymUI.loaded=true; }

    h += '<p class="small muted" style="margin:0 0 12px">'+(lastDate ? esc(fmt(t("gym_last"),{s:lastSess, d:fmtDate(lastDate,false)}))+' · ' : '')+esc(col==="YELLOW"?t("gym_rule_yellow"):t("gym_rule_green"))+'</p>';

       + (gymUI.session==="ISO" ? '<div></div>' : '<div class="load"><input type="text" inputmode="decimal" data-id="'+ex[0]+'" aria-label="'+esc(ex[1])+' '+esc(t("load"))+'" placeholder="'+(hint?hint.v:"0")+'" value="'+esc(st.load||"")+'"><span>'+esc(t("load"))+'</span></div>')

    var b=$("savegym"); b.disabled=true; b.classList.add("loading");

  });

function qChart(qs){
  if (qs.length<2) return ""; var W=320,H=110,px=28,py=8, n=qs.length, sx=function(i){ return px+i/(n-1)*(W-px-8); }, sy=function(v){ return py+(100-v)/100*(H-py-16); };
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'">'; [0,50,100].forEach(function(g){ svg+='<line x1="'+px+'" y1="'+sy(g)+'" x2="'+(W-8)+'" y2="'+sy(g)+'" stroke="var(--line)"/><text x="'+(px-5)+'" y="'+(sy(g)+4)+'" font-size="9" text-anchor="end" fill="var(--ink-3)">'+g+'</text>'; });
  [["pain_general","var(--bad-fill)"],["function","var(--ink-2)"],["pain_loading","var(--warn-fill)"]].forEach(function(s){ svg+='<polyline fill="none" stroke="'+s[1]+'" stroke-width="2" points="'+qs.map(function(q,i){ return sx(i)+","+sy(q[s[0]]); }).join(" ")+'"/>'; });
  return svg+'</svg><p class="legend">'+t("q_labels").map(function(l,i){ return ["🔴","⚫","🟠"][i]+" "+esc(l.slice(0,22)); }).join(" · ").replace(/🔴|⚫|🟠/g,function(m){ return {"🔴":'<i class="dot RED"></i>',"⚫":'<i class="dot" style="background:var(--ink-2)"></i>',"🟠":'<i class="dot YELLOW"></i>'}[m]; })+'</p>';
}
function isoMean(its){

  if(!ds.length) return ""; var m=ds.reduce(function(a,b){return a+b;},0)/ds.length; return '<p class="small muted" style="margin:6px 0 0">Δ '+(LANG==="fr"?"moyen":"mean")+' : <b>'+(m>0?"−":"+")+Math.abs(m).toFixed(1)+'</b> ('+ds.length+')</p>';
}
